# Server
server.port=8080

spring.application.name=inventory

# Datasource - MySQL
#spring.datasource.url=jdbc:mysql://localhost:3306/stoles_db?useSSL=false&serverTimezone=Asia/Kolkata&allowPublickeyRetrieval=true
#spring.datasource.username=root
#spring.datasource.password=root
#spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# DataSource - H2 (file-based for persistence across restarts)
spring.datasource.url=jdbc:h2:file:./h2database/stolesdb;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
#spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Jackson
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=Asia/Kolkata

# JWT DCCH change this secret in production (min 32 chars)
app.jwt.secret=StOLEsInVeNtOrYsEcReTkEy2024MuStBeAtLeast32CharsLong!
app.jwt.expiration-ms=86400000
# CORS
app.cors.allowed-origins=http://localhost:3000,http://localhost:5173
# H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Actuator (used by Docker HEALTHCHECK)
management.endpoints.web.exposer.include=health
management.endpoint.health.probes.enabled=true